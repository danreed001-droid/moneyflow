name: Money Flow Snapshot

on:
  schedule:
    # Every hour, every day (BTC-USD and the futures book trade nearly around
    # the clock, so this isn't restricted to US weekday market hours).
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snapshot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python money_flow.py

      - name: Commit latest report
        run: |
          git config user.name "money-flow-bot"
          git config user.email "actions@github.com"
          git add latest.txt index.html
          git diff --staged --quiet || git commit -m "Update snapshot $(date -u +%FT%TZ)"
          git push
